<!DOCTYPE html>
<html>
<head><title>測試</title></head>
<body>
<h1>英超智能預測站</h1>
<p id="status">加載中...</p>
<script>
fetch('/data/E0-2627.csv')
  .then(r => r.text())
  .then(data => {
    const lines = data.trim().split('\n');
    const rounds = {};
    for (let i = 1; i < lines.length; i++) {
      const round = lines[i].split(',')[8];
      rounds[round] = (rounds[round] || 0) + 1;
    }
    const maxRound = Math.max(...Object.keys(rounds).map(Number));
    document.getElementById('status').innerHTML = 
      `<strong>數據驗證成功！</strong><br>` +
      `總場數：${lines.length - 1}<br>` +
      `最大輪次：${maxRound}<br>` +
      `預測從第 ${maxRound + 1} 輪開始`;
  });
</script>
</body>
</html>
