name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: cd football-site && npm ci && npm run build

      - name: Deploy to master root
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Actions"

          # Move dist contents to repo root
          rm -f .summary.md
          rm -rf dist/.git 2>/dev/null || true
          mv football-site/dist/* .
          rmdir football-site/dist 2>/dev/null || true
          rmdir football-site 2>/dev/null || true

          git add -A
          git commit -m "deploy: ${{ github.sha }}" --allow-empty || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
