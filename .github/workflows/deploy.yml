name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy dist to master branch root
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Actions"

          # Move dist contents to repo root (GitHub Pages legacy mode reads from root)
          rm -f *.html package.json package-lock.json
          rm -rf src public .github .gitignore
          mv dist/* .
          rm -rf dist

          git add -A
          git commit -m "deploy: ${{ github.sha }}" --allow-empty || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
